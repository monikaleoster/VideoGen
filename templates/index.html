<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VideoGen — Pipeline</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; }
  .step { border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
  .step-header { display: flex; justify-content: space-between; align-items: center; }
  .status { font-family: monospace; padding: 0.1rem 0.5rem; border-radius: 4px; background: #eee; }
  .status-pending { background: #eee; }
  .status-running { background: #ffe9a8; }
  .status-waiting_approval { background: #ffd0a8; }
  .status-done { background: #b7f5b7; }
  pre { background: #f7f7f7; padding: 0.5rem; overflow-x: auto; font-size: 0.85rem; }
  button { margin-right: 0.5rem; padding: 0.3rem 0.8rem; }
</style>
</head>
<body>
<h1>VideoGen — Mock Pipeline</h1>
<div id="steps">
{% for step in steps %}
  <div class="step" data-step="{{ step.name }}">
    <div class="step-header">
      <strong>{{ step.display_name }}</strong>
      <span class="status status-pending" data-role="status">pending</span>
    </div>
    <pre data-role="output" hidden></pre>
    {% if step.name == "tts" %}
    <div data-role="credentials" style="margin-bottom: 0.5rem;">
      <input type="password" data-role="api-key" placeholder="ElevenLabs API key" autocomplete="off">
      <input type="text" data-role="voice-id" placeholder="ElevenLabs voice ID" autocomplete="off">
    </div>
    <div data-role="tts-slides"></div>
    {% endif %}
    <div data-role="actions"></div>
  </div>
{% endfor %}
</div>

<script>
// The tts step's API key / voice ID fields are read live from the DOM at
// Run/Reject time and never written to localStorage, cookies, or any
// server-side file — they exist only in this page's in-memory state for
// the run being submitted (per specs/2026-08-23-audio-generation-real).
function render(snapshot) {
  for (const [name, step] of Object.entries(snapshot)) {
    const row = document.querySelector(`.step[data-step="${name}"]`);
    if (!row) continue;

    const statusEl = row.querySelector('[data-role="status"]');
    statusEl.textContent = step.status;
    statusEl.className = `status status-${step.status}`;

    const outputEl = row.querySelector('[data-role="output"]');
    if (step.output !== null) {
      outputEl.textContent = JSON.stringify(step.output, null, 2);
      outputEl.hidden = false;
    } else {
      outputEl.hidden = true;
    }

    const actions = row.querySelector('[data-role="actions"]');
    actions.innerHTML = "";
    if (step.status === "pending") {
      actions.appendChild(makeButton("Run", () => postAction(name, "run")));
    } else if (step.status === "waiting_approval") {
      actions.appendChild(makeButton("Approve", () => postAction(name, "approve")));
      actions.appendChild(makeButton("Reject", () => postAction(name, "reject")));
    }

    if (name === "tts") {
      renderTtsSlides(row, step, snapshot.notes_extraction);
    }
  }
}

// Rebuilds the per-slide rows only when the number of slides changes (a
// fresh run), so an in-progress edit to a slide's text box isn't wiped out
// by a routine WebSocket status update; audio/duration display always
// refreshes in place.
function renderTtsSlides(row, ttsStep, notesStep) {
  const container = row.querySelector('[data-role="tts-slides"]');
  const notes = notesStep?.output?.notes ?? [];
  const hasNotes = notesStep?.output?.has_notes ?? [];
  const audioPaths = ttsStep.output?.audio_paths ?? [];
  const durations = ttsStep.output?.durations_sec ?? [];

  if (audioPaths.length === 0) {
    container.innerHTML = "";
    return;
  }

  if (container.dataset.slideCount !== String(audioPaths.length)) {
    container.innerHTML = "";
    container.dataset.slideCount = String(audioPaths.length);

    const generateAllBtn = makeButton("Generate All", () =>
      postAction("tts", ttsStep.status === "pending" ? "run" : "reject")
    );
    generateAllBtn.style.marginBottom = "0.5rem";
    container.appendChild(generateAllBtn);

    audioPaths.forEach((_, i) => {
      const slideRow = document.createElement("div");
      slideRow.dataset.slideIndex = String(i);
      slideRow.style.marginBottom = "0.4rem";

      const label = document.createElement("span");
      label.textContent = `Slide ${i + 1}${hasNotes[i] ? "" : " (no notes)"}: `;

      const textInput = document.createElement("input");
      textInput.type = "text";
      textInput.dataset.role = "slide-text";
      textInput.style.width = "40%";
      textInput.value = notes[i] ?? "";

      const audioLabel = document.createElement("span");
      audioLabel.dataset.role = "slide-audio-label";
      audioLabel.style.margin = "0 0.5rem";

      const generateBtn = makeButton("Generate", () => generateSlide(row, i));

      const audioPlayer = document.createElement("audio");
      audioPlayer.dataset.role = "slide-audio-player";
      audioPlayer.controls = true;
      audioPlayer.style.verticalAlign = "middle";
      audioPlayer.style.height = "1.75rem";
      audioPlayer.hidden = true;

      slideRow.append(label, textInput, generateBtn, audioLabel, audioPlayer);
      container.appendChild(slideRow);
    });
  }

  audioPaths.forEach((path, i) => {
    const slideRowEl = container.querySelector(`[data-slide-index="${i}"]`);
    if (!slideRowEl) return;

    const audioLabel = slideRowEl.querySelector('[data-role="slide-audio-label"]');
    const audioPlayer = slideRowEl.querySelector('[data-role="slide-audio-player"]');
    const audioUrl = `/pipeline/tts/slide/${i}/audio`;

    if (path !== null) {
      audioLabel.textContent = `${durations[i]?.toFixed(1)}s`;
      // Only reassign `src` when it's actually changed — a regenerated
      // slide's URL is identical (same path, overwritten in place), so
      // reloading it every WebSocket tick would restart playback.
      if (audioPlayer.dataset.loadedFor !== path) {
        audioPlayer.src = audioUrl;
        audioPlayer.dataset.loadedFor = path;
      }
      audioPlayer.hidden = false;
    } else {
      audioLabel.textContent = "no audio";
      audioPlayer.hidden = true;
      audioPlayer.removeAttribute("src");
      delete audioPlayer.dataset.loadedFor;
    }
  });
}

async function generateSlide(ttsRow, index) {
  const creds = ttsCredentials(ttsRow);
  const text = ttsRow.querySelector(
    `[data-slide-index="${index}"] [data-role="slide-text"]`
  ).value;
  await fetch(`/pipeline/tts/slide/${index}/generate`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...creds, text }),
  });
}

function makeButton(label, onClick) {
  const btn = document.createElement("button");
  btn.textContent = label;
  btn.onclick = onClick;
  return btn;
}

function ttsCredentials(row) {
  return {
    api_key: row.querySelector('[data-role="api-key"]')?.value ?? "",
    voice_id: row.querySelector('[data-role="voice-id"]')?.value ?? "",
  };
}

async function postAction(step, action) {
  const row = document.querySelector(`.step[data-step="${step}"]`);
  const body = step === "tts" ? ttsCredentials(row) : {};
  await fetch(`/pipeline/${step}/${action}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}

const ws = new WebSocket(`ws://${location.host}/ws/pipeline-status`);
ws.onmessage = (event) => render(JSON.parse(event.data));
</script>
</body>
</html>
